<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f2efe7">
    <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <div class="paper-noise" aria-hidden="true"></div>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="返回首页">
        <span class="brand-mark">拙</span>
        <span class="brand-copy">
          <strong>{{ site.title }}</strong>
          <small>ENGINEERING FIELD NOTES</small>
        </span>
      </a>
      <nav class="site-nav" aria-label="主导航">
        <a class="nav-articles" href="{{ '/' | relative_url }}">文章</a>
        <a class="nav-topics" href="{{ '/topics/' | relative_url }}">主题</a>
        <a class="nav-skills" href="{{ '/skills/' | relative_url }}">Skills</a>
        <a class="nav-about" href="{{ '/about/' | relative_url }}">关于</a>
        <button class="theme-toggle" type="button" aria-label="切换明暗主题" title="切换明暗主题">
          <span aria-hidden="true">◐</span>
        </button>
      </nav>
    </header>

    <main>{{ content }}</main>

    <footer class="site-footer">
      <p>把踩过的坑，铺成后来者的路。</p>
      <p class="footer-meta">© {{ 'now' | date: '%Y' }} {{ site.author }} · Built with Jekyll & GitHub Pages</p>
    </footer>
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  </body>
</html>
