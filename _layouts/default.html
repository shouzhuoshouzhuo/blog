<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#faf9f6">
    <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
    <script>
      try {
        const saved = localStorage.getItem("blog-theme");
        document.documentElement.dataset.theme = saved === "dark" || saved === "light" ? saved : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch (_) { document.documentElement.dataset.theme = "light"; }
    </script>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% for stylesheet in page.styles %}
    <link rel="stylesheet" href="{{ stylesheet | relative_url }}">
    {% endfor %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到内容</a>
    <div class="reading-progress" aria-hidden="true"></div>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="返回首页">
        <span class="brand-mark">拙</span>
        <span class="brand-copy">
          <strong>{{ site.title }}</strong>
          <small>思考 · 实践 · 记录</small>
        </span>
      </a>
      <nav class="site-nav" aria-label="主导航">
        <a class="nav-articles" href="{{ '/' | relative_url }}">文章</a>
        <a class="nav-about" href="{{ '/about/' | relative_url }}">作者</a>
        <button class="theme-toggle" type="button" aria-label="切换明暗主题" title="切换明暗主题">
          <span aria-hidden="true">◐</span>
        </button>
      </nav>
    </header>

    <main id="main-content" tabindex="-1">{{ content }}</main>

    <footer class="site-footer">
      <div class="footer-links"><a href="mailto:2965908658@qq.com">联系我</a><span class="footer-meta">© {{ 'now' | date: '%Y' }} {{ site.title }}</span></div>
    </footer>
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
    {% for script in page.scripts %}
    <script src="{{ script | relative_url }}" defer></script>
    {% endfor %}
  </body>
</html>
